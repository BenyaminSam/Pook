---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - storage.pook.io
  resources:
  - rbdmirrors
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - storage.pook.io
  resources:
  - rbdmirrors/status
  verbs:
  - get
  - patch
  - update
